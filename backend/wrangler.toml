name = "tooglemap"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Sans ça, chaque déploiement (déclenché par un simple push Git) EFFACE
# les variables/secrets ajoutés depuis le dashboard Cloudflare qui ne sont
# pas déclarés ici (ex. ORS_API_KEY) — comportement par défaut de
# `wrangler deploy`, documenté ici :
# https://developers.cloudflare.com/workers/wrangler/configuration/
keep_vars = true

# Domaine autorisé à appeler ce Worker (celui du frontend déployé),
# pour éviter que d'autres sites consomment le quota ORS.
[vars]
ALLOWED_ORIGIN = "https://tooglesmaps.0xcryptoyabun.workers.dev"

# La clé API OpenRouteService NE VA PAS ici (fichier versionné dans git).
# Une fois le compte ORS créé (https://openrouteservice.org/dev/#/signup),
# configure-la avec :
#   wrangler secret put ORS_API_KEY
